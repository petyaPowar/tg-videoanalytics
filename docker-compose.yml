services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videoanalytics
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d videoanalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      network: host
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS}
      DB_URL: jdbc:postgresql://127.0.0.1:5432/videoanalytics
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    restart: unless-stopped

volumes:
  pgdata:
